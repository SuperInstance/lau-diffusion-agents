[package]
name = "lau-diffusion-agents"
version = "0.1.0"
edition = "2021"
description = "Diffusion processes on agent interaction manifolds"
license = "MIT"

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
rand = "0.8"
rand_distr = "0.4"

[dev-dependencies]
approx = "0.5"

[lib]
path = "src/lib.rs"
